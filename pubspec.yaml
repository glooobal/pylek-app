name: pylek
description: "App for allergic sufferers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_sfsymbols: ^2.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: sficonsets
      fonts:
        - asset: packages/flutter_sfsymbols/fonts/sficonsets.ttf
